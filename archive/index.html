      --muted: #9aa0b0;
      --accent: #6c8cff;
      --accent2: #4ad1a0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);

      transition: border-color .2s;
    }
    .arch-item:hover { border-color: var(--accent); }
    .arch-item a { color: var(--text); text-decoration: none; font-size: 1.05em; font-weight: 600; }
    .arch-item a:hover { color: var(--accent); }
    .arch-item .meta { color: var(--muted); font-size: 0.85em; }
    footer { text-align: center; color: var(--muted); font-size: 0.8em; padding: 30px 0 10px; border-top: 1px solid var(--border); margin-top: 30px; }
    .empty { color: var(--muted); text-align: center; padding: 40px; }
  </style>
</head>
