<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI for Business 领域每日晨报</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2e3d;
      --text: #e6e8ef;
      --muted: #9aa0b0;
      --accent: #6c8cff;
      --accent2: #4ad1a0;
      --warn: #ffb454;
      --red: #ff6b6b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      padding: 30px 0 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    header h1 {
      font-size: 1.8em;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header .date { color: var(--muted); margin-top: 8px; font-size: 0.95em; }
    .archive-link { display: inline-block; margin-top: 10px; color: var(--accent); text-decoration: none; font-size: 0.85em; border: 1px solid var(--border); padding: 4px 12px; border-radius: 20px; }
    .archive-link:hover { border-color: var(--accent); background: rgba(108,140,255,0.08); }
    .banner {
      background: linear-gradient(135deg, rgba(108,140,255,0.12), rgba(74,209,160,0.12));
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }
    .banner h2 { font-size: 1.05em; color: var(--accent2); margin-bottom: 6px; }
    .banner p { color: var(--text); font-size: 0.95em; }

    .item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: border-color .2s, transform .1s;
    }
    .item:hover { border-color: var(--accent); transform: translateY(-1px); }
    .item:active { transform: scale(0.995); }
    .item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .tag {
      display: inline-block;
      font-size: 0.72em;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
    }
    .tag-paper { background: rgba(108,140,255,0.15); color: var(--accent); }
    .tag-github { background: rgba(74,209,160,0.15); color: var(--accent2); }
    .tag-product { background: rgba(255,180,84,0.15); color: var(--warn); }
    .tag-blog { background: rgba(255,107,107,0.15); color: var(--red); }
    .detail-hint { font-size: 0.78em; color: var(--accent); opacity: .8; }
    .item h3 { font-size: 1.1em; margin-bottom: 8px; }
    .item h3 a { color: var(--text); text-decoration: none; }
    .item h3 a:hover { color: var(--accent); }
    .item .meta { color: var(--muted); font-size: 0.82em; margin-bottom: 10px; }
    .item .summary { font-size: 0.95em; margin-bottom: 10px; }
    .item .insight {
      background: rgba(108,140,255,0.06);
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 0.92em;
      color: var(--muted);
    }
    .item .insight strong { color: var(--accent2); }

    /* ===== 详情弹层 ===== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5,7,12,0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      overflow-y: auto;
      padding: 30px 20px;
    }
    .modal.show { display: block; }
    .modal-content {
      background: #141824;
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 820px;
      margin: 0 auto;
      padding: 32px 36px;
      position: relative;
      animation: pop .18s ease;
    }
    @keyframes pop { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal-close {
      position: absolute;
      top: 14px; right: 16px;
      background: none; border: none;
      color: var(--muted);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .modal-close:hover { color: var(--text); background: rgba(255,255,255,0.06); }
    .modal-content h2 {
      font-size: 1.4em;
      color: var(--text);
      margin: 10px 0 6px;
      line-height: 1.4;
      padding-right: 30px;
    }
    .modal-content .meta { color: var(--muted); font-size: 0.85em; margin-bottom: 18px; }
    .modal-body { margin-top: 8px; }
    .modal-sec {
      background: #1a1e2b;
      border: 1px solid #262b3a;
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .modal-sec h4 { font-size: 0.95em; color: var(--accent2); margin-bottom: 8px; }
    .modal-sec p { font-size: 0.93em; color: var(--text); }
    .modal-sources { background: rgba(255,255,255,0.02); }
    .modal-business { background: rgba(255,180,84,0.05); }
    .modal-business h4 { color: var(--warn); }
    .sources-list { list-style: none; padding: 0; margin: 0; }
    .sources-list li { font-size: 0.88em; color: var(--muted); margin-bottom: 6px; padding-left: 4px; }
    .src-id { color: var(--accent); font-weight: 600; margin-right: 6px; }
    .src-link { color: var(--accent); text-decoration: none; word-break: break-all; }
    .src-link:hover { text-decoration: underline; }
    .diagram-box {
      background: #0b0e16;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      overflow-x: auto;
    }
    .modal-foot {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .modal-link { color: var(--accent); font-size: 0.88em; text-decoration: none; word-break: break-all; }
    .modal-link:hover { text-decoration: underline; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8em;
      padding: 30px 0 10px;
      border-top: 1px solid var(--border);
      margin-top: 30px;
    }
    .empty { color: var(--muted); text-align: center; padding: 40px; }
    /* ===== 反馈按钮 + 提交按钮 ===== */
    .feedback-fab {
      position: fixed; bottom: 24px; right: 24px;
      width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; color: #fff; font-size: 24px; cursor: pointer;
      box-shadow: 0 4px 16px rgba(108,140,255,0.4);
      z-index: 9000; transition: transform .15s;
    }
    .feedback-fab:hover { transform: scale(1.1); }
    .modal-submit {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; font-size: 1em; font-weight: 600; cursor: pointer;
    }
    .modal-submit:hover { opacity: 0.9; }
    @media (max-width: 600px) {
      .modal-content { padding: 24px 18px; }
      body { padding: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🤖 AI for Business 每日晨报</h1>
    <div class="date">业务知识库 · 业务语义理解 · API 精确查询 | {{DATE}}</div>
    <a class="archive-link" href="archive/index.html">📚 历史晨报归档</a>
  </header>

  {{BANNER}}

  {{ITEMS}}

  {{MODALS}}

  <footer>
    由 Hermes Agent 自动生成 · 点击卡片查看深度详情 · {{DATE}}
  </footer>

  <!-- ===== 反馈按钮 + 表单弹层 ===== -->
  <button class="feedback-fab" onclick="openFeedback()" title="提交反馈">💬</button>

  <div class="modal" id="feedback-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeFeedback()" aria-label="关闭">×</button>
      <span class="tag tag-product">💬 读者反馈</span>
      <h2>提交意见 / 反馈</h2>
      <div class="modal-body">
        <p style="color:var(--muted);font-size:0.9em;margin-bottom:12px;">
          你的反馈会帮我改进晨报内容。提交后将打开 GitHub Issue 页面，确认后我会在每天 17:00 处理。
        </p>
        <label style="display:block;margin-bottom:6px;font-size:0.9em;color:var(--accent2);">反馈类型</label>
        <select id="fb-type" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:#1a1e2b;color:var(--text);margin-bottom:12px;">
          <option value="内容建议">内容建议（选题/深度/方向）</option>
          <option value="错误报告">错误报告（链接失效/信息有误）</option>
          <option value="格式反馈">格式/排版反馈</option>
          <option value="其他">其他</option>
        </select>
        <label style="display:block;margin-bottom:6px;font-size:0.9em;color:var(--accent2);">你的反馈内容</label>
        <textarea id="fb-body" rows="5" placeholder="请描述你的意见、建议或发现的问题…"
          style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:#1a1e2b;color:var(--text);resize:vertical;margin-bottom:12px;"></textarea>
        <button class="modal-submit" onclick="submitFeedback()">提交反馈 →</button>
      </div>
      <div class="modal-foot" style="color:var(--muted);font-size:0.8em;">提交后请在打开的 GitHub 页面点击确认。</div>
    </div>
  </div>

  <script>
    function openDetail(i) {
      const m = document.getElementById('modal-' + i);
      if (m) { m.classList.add('show'); document.body.style.overflow = 'hidden'; }
    }
    function closeDetail(i) {
      const m = document.getElementById('modal-' + i);
      if (m) { m.classList.remove('show'); document.body.style.overflow = ''; }
    }
    function openFeedback() {
      document.getElementById('feedback-modal').classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    function closeFeedback() {
      document.getElementById('feedback-modal').classList.remove('show');
      document.body.style.overflow = '';
    }
    function submitFeedback() {
      const type = document.getElementById('fb-type').value;
      const body = document.getElementById('fb-body').value.trim();
      if (!body) { alert('请填写反馈内容'); return; }
      const date = '{{DATE}}';
      const title = '[网页反馈/' + type + '] ' + date;
      const full = '反馈类型: ' + type + '\n日期: ' + date + '\n\n' + body;
      // 生成 GitHub Issue 预填链接（不暴露 token，安全）
      const url = 'https://github.com/hhao9817/agent-daily/issues/new?title=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(full);
      window.open(url, '_blank');
      closeFeedback();
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal.show').forEach(function(m) { m.classList.remove('show'); });
        document.body.style.overflow = '';
      }
    });
  </script>
</body>
</html>
