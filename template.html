<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent 领域每日晨报</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2e3d;
      --text: #e6e8ef;
      --muted: #9aa0b0;
      --accent: #6c8cff;
      --accent2: #4ad1a0;
      --warn: #ffb454;
      --red: #ff6b6b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      padding: 30px 0 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    header h1 {
      font-size: 1.8em;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header .date {
      color: var(--muted);
      margin-top: 8px;
      font-size: 0.95em;
    }
    .banner {
      background: linear-gradient(135deg, rgba(108,140,255,0.12), rgba(74,209,160,0.12));
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }
    .banner h2 { font-size: 1.05em; color: var(--accent2); margin-bottom: 6px; }
    .banner p { color: var(--text); font-size: 0.95em; }
    .item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    .item .tag {
      display: inline-block;
      font-size: 0.72em;
      padding: 2px 8px;
      border-radius: 20px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .tag-paper { background: rgba(108,140,255,0.15); color: var(--accent); }
    .tag-github { background: rgba(74,209,160,0.15); color: var(--accent2); }
    .tag-product { background: rgba(255,180,84,0.15); color: var(--warn); }
    .tag-blog { background: rgba(255,107,107,0.15); color: var(--red); }
    .item h3 { font-size: 1.1em; margin-bottom: 8px; }
    .item h3 a { color: var(--text); text-decoration: none; }
    .item h3 a:hover { color: var(--accent); }
    .item .meta { color: var(--muted); font-size: 0.82em; margin-bottom: 10px; }
    .item .summary { font-size: 0.95em; margin-bottom: 10px; }
    .item .insight {
      background: rgba(108,140,255,0.06);
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 0.92em;
      color: var(--muted);
    }
    .item .insight strong { color: var(--accent2); }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8em;
      padding: 30px 0 10px;
      border-top: 1px solid var(--border);
      margin-top: 30px;
    }
    .empty { color: var(--muted); text-align: center; padding: 40px; }
  </style>
</head>
<body>
  <header>
    <h1>🤖 Agent 领域每日晨报</h1>
    <div class="date">数据分析 Agent · 业务 Agent · 智能体生态 | {{DATE}}</div>
  </header>

  {{BANNER}}

  {{ITEMS}}

  <footer>
    由 Hermes Agent 自动生成 · 关注数据分析型 Agent 与业务型 Agent · {{DATE}}
  </footer>
</body>
</html>
